name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - python-version: '3.9'
            os: ubuntu-22.04
          - python-version: '3.14'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test independent app settings and installation
        run: python3 -m unittest discover -s tests -v
      - name: Verify generated desktop themes
        run: |
          python3 scripts/build-themes.py
          git diff --exit-code -- themes
