# Blackwall Overdrive — generated from the Pi palette
"$schema" = "https://starship.rs/config-schema.json"
command_timeout = 2000
add_newline = true
palette = "blackwall"
format = """
[╭─ 󰆍 OVERDRIVE](bold accent) $os$username$hostname$fill$time
[│](rail)$directory$git_branch$git_status
[╰─](rail)$c$rust$golang$nodejs$php$java$kotlin$haskell$python$docker_context$conda$status$jobs$cmd_duration$character"""
continuation_prompt = "[│ ](rail)[… ](focus)"

[fill]
symbol = "─"
style = "rail"
[os]
disabled = false
format = "[$symbol ](muted)"
[os.symbols]
Macos = "󰀵"
Linux = "󰌽"
Windows = ""
[username]
show_always = true
style_user = "muted"
style_root = "bold red"
format = "[$user ]($style)"
[hostname]
ssh_only = true
format = "[@$hostname ](focus)"
[directory]
style = "bold focus"
format = "[  $path]($style)[$read_only](red) "
read_only = " "
truncation_length = 2
truncation_symbol = "…/"
truncate_to_repo = true
[git_branch]
symbol = " "
style = "muted"
format = "[$symbol$branch(:$remote_branch) ]($style)"
truncation_length = 18
truncation_symbol = "…"
[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "!$count "
stashed = "≡$count "
deleted = "−$count "
renamed = "»$count "
modified = "~$count "
staged = "+$count "
untracked = "?$count "
ahead = "⇡$count "
behind = "⇣$count "
diverged = "⇡$ahead_count⇣$behind_count "
[time]
disabled = false
time_format = "%R"
style = "dim"
format = "[  $time]($style)"
[status]
disabled = false
style = "red"
symbol = " "
format = "[ $symbol$status]($style) "
pipestatus = true
pipestatus_format = "[ $pipestatus]($style) "
[jobs]
symbol = " "
style = "focus"
number_threshold = 1
symbol_threshold = 1
format = "[ $symbol$number]($style) "
[cmd_duration]
min_time = 2000
show_milliseconds = true
style = "dim"
format = "[ 󱎫 $duration]($style) "
show_notifications = true
min_time_to_notify = 45000
[character]
success_symbol = "[ ❯](bold accent)"
error_symbol = "[ ❯](bold red)"
vimcmd_symbol = "[ ❮](bold focus)"
vimcmd_replace_one_symbol = "[ R](bold red)"
vimcmd_replace_symbol = "[ R](bold red)"
vimcmd_visual_symbol = "[ V](bold yellow)"

[c]
symbol = " "
style = "muted"
format = "[ $symbol($version)]($style) "

[rust]
symbol = " "
style = "muted"
format = "[ $symbol($version)]($style) "

[golang]
symbol = " "
style = "muted"
format = "[ $symbol($version)]($style) "

[nodejs]
symbol = " "
style = "muted"
format = "[ $symbol($version)]($style) "

[php]
symbol = " "
style = "muted"
format = "[ $symbol($version)]($style) "

[java]
symbol = " "
style = "muted"
format = "[ $symbol($version)]($style) "

[kotlin]
symbol = " "
style = "muted"
format = "[ $symbol($version)]($style) "

[haskell]
symbol = " "
style = "muted"
format = "[ $symbol($version)]($style) "

[python]
symbol = " "
style = "muted"
format = '[ $symbol($version)( \($virtualenv\))]($style) '

[docker_context]
symbol = " "
style = "muted"
format = "[ $symbol$context]($style) "
[conda]
symbol = " "
style = "muted"
format = "[ $symbol$environment]($style) "
ignore_base = false

[palettes.blackwall]
accent = "#e8cd62"
focus = "#7bd8ae"
text = "#f0f1ec"
muted = "#adb9b4"
dim = "#99aaa2"
red = "#ee9292"
green = "#acdb8a"
yellow = "#e8bd78"
rail = "#303a36"
